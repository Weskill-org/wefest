<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1025" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <title>WeFest — College Festivals, Events & Campus Culture in India</title>
    <meta name="description" content="Discover, register, and attend premier college festivals, cultural fests, tech symposiums, and competitions across India on WeFest." />

    <!-- Open Graph Fallback for Crawlers / WhatsApp / Social Bots (Non-JS) -->
    <meta property="og:site_name" content="WeFest" />
    <meta property="og:title" content="WeFest — College Festivals, Events & Campus Culture in India" />
    <meta property="og:description" content="Discover, register, and attend premier college festivals, cultural fests, tech symposiums, and competitions across India on WeFest." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wefest.weskill.org" />
    <meta property="og:image" content="https://wefest.weskill.org/logo-gold.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wefestapp" />
    <meta name="twitter:title" content="WeFest — College Festivals, Events & Campus Culture in India" />
    <meta name="twitter:description" content="Discover, register, and attend premier college festivals, cultural fests, tech symposiums, and competitions across India on WeFest." />
    <meta name="twitter:image" content="https://wefest.weskill.org/logo-gold.png" />

    <!-- Google Search Console Verification (paste verification token below when ready) -->
    <!-- <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_TOKEN" /> -->

    <!-- Google Fonts — Space Grotesk + Inter with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./favicon.ico" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Global error handler for debugging white screen on device -->
    <script>
      function showError(title, message, file) {
        var root = document.getElementById("root");
        if (root) {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: monospace; word-break: break-all; z-index: 9999; position: relative;">' +
            '<h3>' + title + '</h3>' +
            '<p><strong>Message:</strong> ' + message + '</p>' +
            '<p><strong>File:</strong> ' + (file || 'N/A') + '</p>' +
            '</div>';
        }
      }

      window.addEventListener("error", function(event) {
        showError("Startup Error", event.message, event.filename + ':' + event.lineno);
      });

      window.addEventListener("unhandledrejection", function(event) {
        showError("Promise Rejection", event.reason ? event.reason.toString() : "Unknown reason", "");
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
